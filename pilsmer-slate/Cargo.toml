[package]
name = "pilsmer-slate"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
bytes = "1"
pilsmer-core = { path = "../pilsmer-core" }
sha2 = "0.10"
slatedb = { version = "0.13.1", features = ["compaction_filters"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
