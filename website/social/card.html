<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PiLSMer social card</title>
<style>
* {
  box-sizing: border-box;
}
body {
  width: 1200px;
  height: 630px;
  margin: 0;
  overflow: hidden;
  position: relative;
  background:
    radial-gradient(circle at 78% 12%, rgba(245, 196, 0, 0.22), transparent 360px),
    linear-gradient(112deg, #05110b 0%, #080b07 48%, #121506 100%);
  color: #fff5cf;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.beer-field {
  position: absolute;
  inset: 0 0 0 auto;
  width: 410px;
  background:
    linear-gradient(180deg, rgba(255, 245, 207, 0.22), transparent 42%),
    url("../assets/pilsner-texture.jpg") center / cover,
    #f5c400;
  clip-path: polygon(18% 0, 100% 0, 100% 100%, 0 100%);
}
.red-rule {
  position: absolute;
  left: 64px;
  bottom: 64px;
  width: 260px;
  height: 4px;
  background: #d3202a;
}
.watermark {
  position: absolute;
  right: 112px;
  bottom: -110px;
  color: rgba(245, 196, 0, 0.58);
  font: 520px/0.8 Georgia, serif;
}
.brand {
  position: absolute;
  left: 64px;
  top: 58px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.mark {
  width: 54px;
  height: 54px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255, 245, 207, 0.32);
  border-radius: 50%;
  background: rgba(245, 196, 0, 0.14);
  color: #f5c400;
  font: 38px/1 Georgia, serif;
}
.mark span {
  display: block;
  transform: translateY(-3px);
}
.brand-name {
  font-size: 30px;
  line-height: 1;
  font-weight: 900;
}
h1 {
  position: absolute;
  left: 64px;
  top: 176px;
  width: 700px;
  margin: 0;
  font-size: 86px;
  line-height: 0.9;
  letter-spacing: 0;
  font-weight: 950;
}
.sub {
  position: absolute;
  left: 68px;
  top: 382px;
  width: 590px;
  color: #b9ad87;
  font-size: 28px;
  line-height: 1.32;
  font-weight: 680;
}
.digits {
  position: absolute;
  right: -108px;
  top: 54px;
  width: 280px;
  color: rgba(23, 17, 6, 0.5);
  font: 800 18px/1.28 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  word-break: break-all;
  transform: rotate(90deg);
}
</style>
</head>
<body>
  <div class="beer-field"></div>
  <div class="watermark">&pi;</div>
  <div class="digits">3141592653589793238462643383279502884197169399375105820974944592307816406286208998628034825</div>
  <div class="brand">
    <div class="mark"><span>&pi;</span></div>
    <div class="brand-name">PiLSMer</div>
  </div>
  <h1>Data-free key-value storage.</h1>
  <div class="sub">Transcendental compaction. Pi for storage. Regret for reads.</div>
  <div class="red-rule"></div>
</body>
</html>
