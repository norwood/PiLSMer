[package]
name = "pilsmer-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "pilsmer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
pilsmer-core = { path = "../pilsmer-core" }
pilsmer-slate = { path = "../pilsmer-slate" }
slatedb = "0.13.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

